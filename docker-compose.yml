services:
  app:
    build:
      context: .
      target: devbox
    image: grayce-aesthetics-devbox:latest
    container_name: grayce-aesthetics
    init: true
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: .env.devbox
        required: false
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      - .:/app
      - grayce-aesthetics-node-modules:/app/node_modules
    command: >
      sh -c "set -e;
      rm -rf .next out;
      CI=true pnpm install --frozen-lockfile --prod=false --store-dir /pnpm/store;
      pnpm build;
      pnpm start"
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network
      - traefik.http.routers.grayce-aesthetics.rule=Host(`grayce-aesthetics.sonnydev.com`)
      - traefik.http.routers.grayce-aesthetics.entrypoints=web,websecure
      - traefik.http.routers.grayce-aesthetics.tls.certresolver=letsencrypt
      - traefik.http.services.grayce-aesthetics.loadbalancer.server.port=3000
      - traefik.http.middlewares.grayce-aesthetics-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.grayce-aesthetics-redirect.redirectscheme.permanent=true
      - traefik.http.routers.grayce-aesthetics-http.rule=Host(`grayce-aesthetics.sonnydev.com`)
      - traefik.http.routers.grayce-aesthetics-http.entrypoints=web
      - traefik.http.routers.grayce-aesthetics-http.middlewares=grayce-aesthetics-redirect
      - traefik.http.middlewares.grayce-aesthetics-www-redirect.redirectregex.regex=^https?://www\.grayce-aesthetics\.sonnydev\.com/(.*)
      - traefik.http.middlewares.grayce-aesthetics-www-redirect.redirectregex.replacement=https://grayce-aesthetics.sonnydev.com/$${1}
      - traefik.http.middlewares.grayce-aesthetics-www-redirect.redirectregex.permanent=true
      - traefik.http.routers.grayce-aesthetics-www.rule=Host(`www.grayce-aesthetics.sonnydev.com`)
      - traefik.http.routers.grayce-aesthetics-www.entrypoints=websecure
      - traefik.http.routers.grayce-aesthetics-www.tls.certresolver=letsencrypt
      - traefik.http.routers.grayce-aesthetics-www.middlewares=grayce-aesthetics-www-redirect
      - traefik.http.routers.grayce-aesthetics-www.service=grayce-aesthetics
      - traefik.http.routers.grayce-aesthetics-www-http.rule=Host(`www.grayce-aesthetics.sonnydev.com`)
      - traefik.http.routers.grayce-aesthetics-www-http.entrypoints=web
      - traefik.http.routers.grayce-aesthetics-www-http.middlewares=grayce-aesthetics-www-redirect
      - traefik.http.routers.grayce-aesthetics-www-http.service=grayce-aesthetics
    networks:
      - traefik-network

volumes:
  grayce-aesthetics-node-modules:

networks:
  traefik-network:
    external: true
